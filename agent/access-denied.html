<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ไม่มีสิทธิ์เข้าถึง — KLADEE BROKER</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body data-base-path="../">
  <div class="agent-access-denied">
    <div class="agent-access-denied__card">
      <div class="agent-access-denied__icon" aria-hidden="true"><i data-lucide="shield-off"></i></div>
      <h1 class="agent-access-denied__title">ไม่มีสิทธิ์เข้าถึง</h1>
      <p class="agent-access-denied__text">บัญชีของคุณยังไม่ได้รับสิทธิ์ใช้งานฟังก์ชันนี้ หรือสิทธิ์ถูกระงับชั่วคราว<br>กรุณาติดต่อผู้ดูแลระบบ</p>
      <div class="agent-access-denied__actions">
        <button type="button" class="btn-primary" id="agentAccessRetry">ลองใหม่</button>
        <button type="button" class="btn-secondary" id="agentAccessLogout">ออกจากระบบ</button>
      </div>
    </div>
  </div>
  <script src="../js/load-agent.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const base = document.body.dataset.basePath || '../';
      if (!window.App) return;

      App.RoleGuard.enforce('agent', { basePath: base });

      try {
        await App.AuthService.refreshUser();
      } catch (e) { /* ignore */ }

      const user = App.AuthService.getCurrentUser();
      const allowed = App.AgentFeatures?.firstAllowedPage(user);
      if (allowed?.page) {
        window.location.replace(`${base}${allowed.page}`);
        return;
      }

      if (typeof lucide !== 'undefined') lucide.createIcons();

      document.getElementById('agentAccessRetry')?.addEventListener('click', async () => {
        try {
          await App.AuthService.refreshUser();
          const next = App.AgentFeatures?.firstAllowedPage(App.AuthService.getCurrentUser());
          if (next?.page) {
            window.location.replace(`${base}${next.page}`);
          } else {
            window.location.reload();
          }
        } catch (e) {
          window.location.reload();
        }
      });

      document.getElementById('agentAccessLogout')?.addEventListener('click', () => {
        App.AuthService.logout();
        window.location.replace(`${base}${App.Permissions.loginPath()}`);
      });
    });
  </script>
</body>
</html>
