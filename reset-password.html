<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งรหัสผ่านใหม่ — กล้าดีโบรคเกอร์</title>
  <link rel="icon" href="images/favicon.png?v=20260811k" type="image/png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css?v=20260816k">
</head>
<body class="login-page">
  <div class="login-stage">
    <main class="login-formCol">
      <div class="login-formCol__inner">
        <header class="login-brand">
          <img src="images/logo-kladee.png" alt="กล้าดีโบรคเกอร์" class="login-brand__logo" width="180" height="44" decoding="async">
          <p class="login-brand__eyebrow">ศูนย์นายหน้า</p>
          <h1 class="login-brand__title">ตั้งรหัสผ่านใหม่</h1>
          <p class="login-brand__sub">กรอกรหัสผ่านใหม่สำหรับบัญชีของคุณ</p>
        </header>

        <div class="login-error" id="resetError" role="alert"></div>
        <div class="login-lockout" id="resetSuccess" hidden role="status"></div>

        <form id="resetForm" class="login-form" novalidate>
          <div class="login-field">
            <label for="newPassword">รหัสผ่านใหม่</label>
            <div class="login-field__control">
              <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" placeholder="อย่างน้อย 4 ตัวอักษร" required minlength="4">
              <button type="button" class="login-togglePass" id="togglePassword" aria-label="แสดงรหัสผ่าน">แสดง</button>
            </div>
          </div>
          <div class="login-field">
            <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="กรอกรหัสผ่านอีกครั้ง" required minlength="4">
          </div>
          <button type="submit" class="login-submit" id="resetSubmit">บันทึกรหัสผ่านใหม่</button>
        </form>

        <p class="login-signup"><a href="login.html">กลับไปหน้าเข้าสู่ระบบ</a></p>
      </div>
    </main>
  </div>

  <script src="js/config/app-config.js"></script>
  <script src="js/mock/data.js"></script>
  <script src="js/mock/api.js"></script>
  <script src="js/services/api-client.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/services/auth-service.js"></script>
  <script src="js/services/agent-identity-service.js"></script>
  <script src="js/pages/reset-password.js?v=20260819e"></script>
</body>
</html>
